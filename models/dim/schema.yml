version: 2

models:
  - name: dim_hosts_cleansed
    description: "This table derives data from source src hosts."

    columns:
      - name: host_id
        description: "This represents the host id."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('src_hosts_old')
                field: host_id

      - name: host_name
        description: "This represents the host name."
        tests:
          
          - not_null

      - name: is_superhost
        description: "This represents if the host is a superhost."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

      - name: created_at
        tests:
          
          - not_null

      - name: updated_at
        tests:

          - not_null

  - name: dim_listings_cleansed
    description: "Cleansed listings; rows with minimum_nights < 1 are excluded."

    columns:
      - name: listing_id
        tests:
          - unique
          - not_null

      - name: host_id
        tests:
          - not_null

      - name: created_at
        tests:
          - not_null

  - name: dim_listings_hosts_cleansed
    description: "Listings joined to cleansed hosts. Feeds all exposures."
    tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1

    columns:
      - name: listing_id
        tests:
          - unique
          - not_null

      - name: host_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
              config:
                severity: warn

      - name: created_at
        tests:
          - not_null

      - name: updated_at
        tests:
          - not_null